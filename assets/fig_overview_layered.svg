<text x="510" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#8C1515">Three lines of method, one proving ground.</text>
<text x="510" y="47" text-anchor="middle" font-size="12.5" fill="#667085">Each line begins from a condition that only shows up once a system leaves the lab.</text>

<rect x="30" y="64" width="960" height="56" rx="10" fill="#faf4f4" stroke="#eddcdc"/>
<text x="46" y="84" font-size="10" fill="#a89393" letter-spacing="1.2">CONDITIONS THAT DEFINE THE PROBLEM</text>
<g font-size="12.5" fill="#2b3038">
  <text x="46" y="106"><tspan font-weight="700" fill="#8C1515">Resources.</tspan> Compute and energy are bounded.</text>
  <text x="376" y="106"><tspan font-weight="700" fill="#8C1515">Data.</tspan> It stays where it was collected.</text>
  <text x="700" y="106"><tspan font-weight="700" fill="#8C1515">Outputs.</tspan> A wrong one has a cost.</text>
</g>

